name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - name: Verify bundled phone setup page
        run: |
          node --test scripts/test-camera-watchdog.mjs
          npm --prefix web/phone ci --ignore-scripts
          npm --prefix web/phone test
          npm --prefix web/phone run build
          git diff --exit-code -- app/src/main/assets/phone/setup.js app/src/main/assets/phone/setup.js.LEGAL.txt
      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v7
        with:
          name: Open-home-TV-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
